name: test
description: Install the locked environment and run the test suite.

inputs:
  python-version:
    description: Python version to run the suite against.
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - run: uv sync --locked
      shell: bash
      env:
        UV_PYTHON_PREFERENCE: only-managed

    - run: uv run --no-sync python -VV
      shell: bash

    - run: uv run --no-sync pytest
      shell: bash
