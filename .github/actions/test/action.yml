name: test
description: Install the locked environment and run the test suite.

inputs:
  python-version:
    description: Python version to run the suite against.
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - run: uv sync --locked
      shell: bash

    - run: uv run pytest
      shell: bash
